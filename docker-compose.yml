services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: veckersviller-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres

  nginx:
    image: nginx:1.27-alpine
    container_name: veckersviller-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    container_name: veckersviller-postgres
    environment:
      POSTGRES_DB: veckersviller
      POSTGRES_USER: veckersviller
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
